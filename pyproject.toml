[project]
name = "crypto-stat-arb"
version = "0.1.0"
description = "Cross-sectional statistical arbitrage research on cryptocurrency markets"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "sqlalchemy==2.0.49",
    "psycopg2-binary==2.9.12",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
    "ipykernel==7.2.0",
    "nbconvert==7.17.1",
    "pytest>=9.0",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
extend-exclude = ["scratch", "research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]
