reference_base_config: configs/base.yaml

# Timeframe and trading-cadence controls.
# holding_period_bars is the single trading-cadence knob for backtests;
# ic_rebalance_bars decimates the signal for IC analysis only.
signal_timeframe: 24h
ic_rebalance_bars: 1
holding_period_bars: 20
execution_delay_bars: 0

# Signal and evaluation windows (measured in signal bars).
momentum_lookback_bars: 30
# Jegadeesh-Titman skip: drop the most recent bar so short-horizon reversal
# does not contaminate the momentum score.
momentum_skip_bars: 1
log_returns: true
vol_window_bars: 14
benchmark_symbol: XBT/USD
# Relative residuals: "log" (same units as core returns) or "simple" (P&L-aligned).
residual_space: log

# Market-beta neutrality; 90 bars = about 3 months. market_index_mode sets the
# factor for the residual-momentum feature only; the hedge and exposure
# diagnostics always use benchmark_symbol, the tradable instrument.
market_index_mode: equal_weight
beta_window_bars: 90
beta_min_periods_bars: 70
beta_shrinkage: 0.2
beta_shrink_target: 1.0
# Hedge overlay: an XBT/USD position sized to cancel ex-ante beta (costed).
beta_hedge_enabled: false
max_hedge_weight: null

# Feature families to compare. Horizons are in signal bars (24h each), i.e.
# one week to two months.
feature_horizons_bars: [5, 10, 20, 40, 60]
momentum_skip_grid_bars: [1, 2, 3]
holding_period_grid_bars: [1, 3, 5, 10, 14, 21, 30, 40]
cross_sectional_transform_grid: [rank]
universe_top_n_grid: [10, 20]

# Universe and data controls.
use_monthly_universe: true
max_assets: 20
data_start_date: 2020-09-30 23:59:59+00:00
data_end_date: 2024-06-30 23:59:59+00:00
train_split_date: 2022-06-30 23:59:59+00:00

# Signal post-processing.
cross_sectional_transform: rank
min_assets_per_timestamp: 6

# Portfolio and costs. fee_bps and half_spread_bps are one-way rates charged
# on every fill.
top_quantile: 0.2
bottom_quantile: 0.2
fee_bps: 10.0
half_spread_bps: 1.0
# One-way taker fee tiers for the cost sensitivity (fee_bps is always included):
# 5 bps is the top professional tier; 40 bps a retail entry-tier rate.
fee_tier_grid_bps: [5.0, 10.0, 20.0, 40.0]

# Robustness diagnostics.
rolling_window_bars: 60
